version: 2
updates:
  # Dev tooling (Playwright). The server itself has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Keeps the GitHub Actions used in workflows current, so security fixes arrive as PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
